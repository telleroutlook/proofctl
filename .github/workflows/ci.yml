name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run fuzz job daily at 02:00 UTC.
    - cron: "0 2 * * *"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-compliant:"
            echo "$unformatted"
            exit 1
          fi

      - name: bridge.py sync check
        run: |
          if ! diff adapters/cap/bridge.py internal/scaffold/bridge.py; then
            echo "ERROR: adapters/cap/bridge.py and internal/scaffold/bridge.py are out of sync."
            echo "Update internal/scaffold/bridge.py to match adapters/cap/bridge.py, then rebuild."
            exit 1
          fi

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test -timeout 120s ./...

      - name: Integration tests
        run: go test -tags integration -timeout 120s ./...

      - name: Test with race detector
        run: go test -race -timeout 120s ./...

      - name: Coverage threshold check
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./internal/kernel/... ./internal/release/... ./pkg/protocol/v2/... 2>/dev/null
          go tool cover -func=coverage.out | grep -E "^total" | awk '{
            pct = $3
            gsub(/%/, "", pct)
            if (pct + 0 < 80.0) {
              print "FAIL: coverage " pct "% < 80% threshold"
              exit 1
            }
            print "OK: coverage " pct "%"
          }'

  example-smoke-test:
    name: Example Smoke Test
    runs-on: ubuntu-latest
    # Catches schema drift between graph.json, check.sh, and the engine.
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build proofctl
        run: go build -o /usr/local/bin/proofctl ./cmd/proofctl

      - name: Smoke test — examples/minimal end-to-end
        working-directory: examples/minimal
        run: |
          set -euo pipefail

          # 1. init
          proofctl init --policy policies/minimal-v1.json

          # 2. compile (fills zero statement digests)
          proofctl compile --fix-digests graph.json

          # 3. Import dummy certificates into CAS
          echo '{"result":"even+even=even"}' > /tmp/cert-even-sum.json
          echo '{"result":"odd+even=odd"}'   > /tmp/cert-odd-plus-even.json
          echo '{"result":"parity ok"}'      > /tmp/cert-parity-main.json
          proofctl cas import /tmp/cert-even-sum.json
          proofctl cas import /tmp/cert-odd-plus-even.json
          proofctl cas import /tmp/cert-parity-main.json

          # 4. Check each claim (checker writes metadata into attestation)
          export BRIDGE_CHECKER="sh checker/check.sh"
          proofctl check @lem-even-sum
          proofctl check @lem-odd-plus-even
          proofctl check @thm-parity-main

          # 5. Release gate — must pass
          proofctl release

          # 6. Assert STATUS.json says released: true
          python3 -c "
          import json, sys
          s = json.load(open('.proofctl/STATUS.json'))
          if not s.get('released'):
              print('FAIL: released is not true', file=sys.stderr)
              print(json.dumps(s, indent=2), file=sys.stderr)
              sys.exit(1)
          print('OK: released =', s['released'])
          "

  domains-lint:
    name: Domains Contract Lint
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install proofctl
        run: go install ./cmd/proofctl

      - name: Lint all domain contracts
        run: |
          set -euo pipefail
          FAIL=0
          for f in domains/*/contracts/*.json; do
            result=$(proofctl contract lint "$f" 2>&1)
            echo "$result"
            echo "$result" | grep -q "OK" || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: one or more contract lint checks failed"
            exit 1
          fi
          echo "All $(ls domains/*/contracts/*.json | wc -l | tr -d ' ') contracts passed lint"

      - name: Metamath domain smoke test
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          proofctl init --domain metamath
          proofctl compile graph.json
          echo "metamath domain: init + compile OK"

  domains-conformance:
    name: Domain Conformance Suite
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run domain conformance tests
        run: go test ./testdata/conformance/... -v

      - name: Run exploit regression tests
        run: go test ./testdata/adversarial/... -v -run TestExploit

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Run on schedule or when fuzz-related files change.
    if: github.event_name == 'schedule' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Fuzz FuzzDecodeStrict_Claim
        run: go test -fuzz=FuzzDecodeStrict_Claim -fuzztime=30s ./internal/ir/...

      - name: Fuzz FuzzCanonicalJSON
        run: go test -fuzz=FuzzCanonicalJSON -fuzztime=30s ./internal/ir/...
