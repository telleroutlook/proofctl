name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build-upload:
    name: Build and upload ${{ matrix.suffix }}
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUTPUT="proofctl-${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-X main.version=${VERSION}" \
            -o "${OUTPUT}" \
            ./cmd/proofctl
          echo "Built ${OUTPUT}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: proofctl-${{ matrix.suffix }}${{ matrix.ext || '' }}
